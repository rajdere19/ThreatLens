<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Powered Cybersecurity Threat Intelligence System</title>
    <meta http-equiv="refresh" content="0; url=http://localhost:5173/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #060a14;
        color: #f1f5f9;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .card {
        background: rgba(13, 23, 44, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 18px;
        padding: 3rem 2.5rem;
        max-width: 540px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 242, 254, 0.15);
      }
      h1 {
        font-family: 'Outfit', sans-serif;
        font-size: 1.85rem;
        font-weight: 800;
        margin: 1rem 0 0.5rem;
        background: linear-gradient(135deg, #fff, #00f2fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        color: #031326;
        font-weight: 700;
        padding: 0.85rem 2rem;
        border-radius: 10px;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 18px rgba(0, 242, 254, 0.3);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(0, 242, 254, 0.5);
      }
      .status {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: #10b981;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .dot {
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 8px #10b981;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="m9 12 2 2 4-4" stroke="#00f2fe" stroke-width="2.5" />
      </svg>
      <h1>AI-Powered Cybersecurity Threat Intelligence System</h1>
      <p>Launching the AI-Powered Cybersecurity Threat Intelligence System...</p>
      <a href="http://localhost:5173" class="btn">Launch Platform →</a>
      <div class="status">
        <span class="dot"></span>
        <span>Dual-Engine ML & Lexical Heuristics Online</span>
      </div>
    </div>
  </body>
</html>
